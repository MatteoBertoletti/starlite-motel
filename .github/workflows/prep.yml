name: prep
# Voice casting (ElevenLabs) and background-music analysis. Results go to the prep-out branch.
on:
  workflow_dispatch:
    inputs:
      voice: { description: 'Run the ElevenLabs voice pick', default: 'true' }
      cast:  { description: 'Use the fixed cast (tools/el_cast.py) instead of the automatic pick', default: 'false' }
      music: { description: 'Run the music analysis', default: 'true' }
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q numpy
      - name: Voice pick
        if: ${{ inputs.voice == 'true' }}
        env: { ELEVENLABS_API_KEY: '${{ secrets.ELEVENLABS_API_KEY }}' }
        run: if [ "${{ inputs.cast }}" = "true" ]; then python tools/el_cast.py; else python tools/el_pick.py; fi
      - name: Music analysis
        if: ${{ !cancelled() && inputs.music == 'true' }}
        run: python tools/music_pick.py
      - name: Save the cast in the repo
        if: ${{ !cancelled() && hashFiles('out/el/voices.json') != '' }}
        run: |
          mkdir -p voices && cp out/el/voices.json voices/it.json
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voices/it.json && git commit -qm "Cast: Italian voices" && git pull -q --rebase && git push -q
      - name: Publish
        if: always()
        run: |
          mkdir -p out && rm -f out/music/*.mp3 && for f in out/el/prev_*.mp3; do :; done && mkdir -p /tmp/pub && cp -r out/* /tmp/pub/ && cd /tmp/pub
          git init -q && git checkout -q -b prep-out
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "prep ${{ github.run_id }}" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" prep-out
